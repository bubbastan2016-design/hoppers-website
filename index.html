<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Hoppers — Under Maintenance</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #1a2f1a 0%, #2d4a2d 50%, #1a2f1a 100%);
    color: #e8f5e8;
    min-height: 100vh;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* Animated grass background */
  .grass-bg {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 200px;
    background: linear-gradient(to top, #0d1f0d, transparent);
    z-index: 0;
    pointer-events: none;
  }

  .grass-blade {
    position: absolute;
    bottom: 0;
    width: 3px;
    background: linear-gradient(to top, #1b3a1b, #2d5a2d);
    border-radius: 50% 50% 0 0;
    animation: sway 3s ease-in-out infinite;
    transform-origin: bottom center;
  }

  @keyframes sway {
    0%, 100% { transform: rotate(-3deg); }
    50% { transform: rotate(3deg); }
  }

  .container {
    text-align: center;
    padding: 40px 20px;
    position: relative;
    z-index: 1;
    max-width: 800px;
  }

  /* Header / Logo */
  .logo {
    font-size: 4rem;
    font-weight: 900;
    letter-spacing: 0.1em;
    color: #7cb87c;
    text-shadow: 0 0 20px rgba(124, 184, 124, 0.5);
    position: relative;
    display: inline-block;
    margin-bottom: 20px;
  }

  .logo .o-container {
    display: inline-block;
    position: relative;
    width: 0.9em;
    height: 0.9em;
    background: radial-gradient(circle at 40% 40%, #d4a574, #8b6914);
    border-radius: 50%;
    border: 3px solid #5a8a5a;
    vertical-align: middle;
    margin: 0 0.05em;
    overflow: hidden;
  }

  .logo .o-container::before {
    content: '';
    position: absolute;
    bottom: 15%;
    left: 20%;
    width: 35%;
    height: 25%;
    background: #6b8e23;
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    box-shadow: 
      0.15em -0.1em 0 -0.05em #556b2f,
      0.3em 0 0 -0.08em #6b8e23;
  }

  .logo .o-container::after {
    content: '';
    position: absolute;
    bottom: 10%;
    left: 10%;
    width: 80%;
    height: 30%;
    background: #8b7355;
    border-radius: 50%;
    opacity: 0.6;
  }

  .baby-dot {
    position: absolute;
    width: 8%;
    height: 8%;
    background: #90ee90;
    border-radius: 50%;
    bottom: 20%;
  }

  .baby-dot:nth-child(1) { left: 25%; }
  .baby-dot:nth-child(2) { left: 45%; }
  .baby-dot:nth-child(3) { left: 65%; }

  .tagline {
    font-size: 1.3rem;
    color: #a8d5a8;
    margin-bottom: 60px;
    font-style: italic;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
  }

  /* Maintenance Message */
  .sorry {
    font-size: 6rem;
    font-weight: 900;
    color: #7cb87c;
    text-shadow: 0 0 30px rgba(124, 184, 124, 0.5);
    margin-bottom: 30px;
    animation: glow 2s infinite;
  }

  @keyframes glow {
    0%, 100% { text-shadow: 0 0 30px rgba(124, 184, 124, 0.5); }
    50% { text-shadow: 0 0 50px rgba(124, 184, 124, 0.8); }
  }

  .maintenance-text {
    font-size: 1.3rem;
    color: #c8e6c8;
    line-height: 1.8;
    margin-bottom: 50px;
  }

  .big-grasshopper {
    font-size: 8rem;
    animation: hop 2s infinite ease-in-out;
    filter: drop-shadow(0 0 20px rgba(124, 184, 124, 0.3));
  }

  @keyframes hop {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    25% { transform: translateY(-20px) rotate(-5deg); }
    50% { transform: translateY(0) rotate(0deg); }
    75% { transform: translateY(-10px) rotate(5deg); }
  }

  /* Floating grasshoppers */
  .floating-hopper {
    position: fixed;
    font-size: 2rem;
    opacity: 0.3;
    pointer-events: none;
    z-index: 0;
    animation: float 10s infinite ease-in-out;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    25% { transform: translateY(-20px) rotate(5deg); }
    50% { transform: translateY(0) rotate(0deg); }
    75% { transform: translateY(-10px) rotate(-5deg); }
  }

  /* Responsive */
  @media (max-width: 600px) {
    .logo { font-size: 2.5rem; }
    .sorry { font-size: 3.5rem; }
    .big-grasshopper { font-size: 5rem; }
    .maintenance-text { font-size: 1.1rem; }
  }
</style>
</head>
<body>

<!-- Floating grasshoppers -->
<div class="floating-hopper" style="top: 10%; left: 5%; animation-delay: 0s;">🦗</div>
<div class="floating-hopper" style="top: 30%; right: 10%; animation-delay: 2s;">🦗</div>
<div class="floating-hopper" style="bottom: 20%; left: 15%; animation-delay: 4s;">🦗</div>

<div class="grass-bg" id="grassBg"></div>

<div class="container">

  <!-- Header -->
  <div class="logo">
    H<span class="o-container"><span class="baby-dot"></span><span class="baby-dot"></span><span class="baby-dot"></span></span>PPERS
  </div>
  <p class="tagline">"We put grasshoppers in a better place — outside, where they belong!"</p>

  <!-- Maintenance Message -->
  <div class="sorry">Sorry!</div>

  <p class="maintenance-text">
    This website is currently under maintenance. Please check later.<br>
    The Hoppers will be with you soon!
  </p>

  <div class="big-grasshopper">🦗</div>

</div>

<script>
  // Generate grass blades
  const grassBg = document.getElementById('grassBg');
  for (let i = 0; i < 50; i++) {
    const blade = document.createElement('div');
    blade.className = 'grass-blade';
    blade.style.left = Math.random() * 100 + '%';
    blade.style.height = (30 + Math.random() * 70) + 'px';
    blade.style.animationDelay = Math.random() * 3 + 's';
    blade.style.animationDuration = (2 + Math.random() * 2) + 's';
    grassBg.appendChild(blade);
  }
</script>

</body>
</html>
